name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-checks:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check web JavaScript
        run: node --check web/js/app.js web/js/ui.js web/js/views.js web/js/player.js web/js/api.js web/js/cache.js web/js/mobile.js web/js/glass.js web/js/gfx.js web/js/icons.js web/js/auth.js web/js/rotur.js
      - name: Validate service worker is parseable
        run: node --check web/sw.js

  ui-checks:
    name: Web UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build the v3 client (ui/ -> web/ui/)
        run: ./scripts/build_ui.sh

  android-checks:
    name: Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and package the debug APK
        run: (cd gui/android && ./gradlew :app:assembleDebug --no-daemon --stacktrace)

  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile key Python modules
        run: |
          python -m py_compile \
            src/mcmusic.py \
            src/config.py \
            src/auth.py \
            src/database.py \
            src/routes/system_routes.py \
            src/routes/library_routes.py \
            src/routes/personal_routes.py \
            src/routes/auth_routes.py \
            src/routes/channel_routes.py \
            src/discord_bot.py \
            src/music_channels.py \
            src/originchats.py
