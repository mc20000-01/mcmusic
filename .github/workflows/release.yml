name: Release builds

# Every push to main produces the same artifacts the server hands out and
# refreshes the rolling "latest" GitHub Release. The repo-root builds/ folder
# is only an ignored, ephemeral staging area: no binaries are committed. A new
# version also gets one immutable v<version> release. Version releases are
# created as drafts, uploaded, checksum-verified, then published; failures
# clean up the draft and its tag. Historical builds are preserved in their own
# non-latest releases and never change the rolling release.
#
# The desktop and iOS builds need their own runners: PyInstaller cannot
# cross-build a .app/.exe and Xcode only runs on macOS. Those jobs upload
# their output and the publish job publishes both releases from scripts/.
#
# Every build is gated on ci-gate: it waits for the CI workflow run on this
# exact commit. A missing, failed or cancelled CI run blocks the release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  ci-gate:
    name: Require passing CI for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      # CI now runs on main pushes too, so every pushed SHA has a run to check.
      # Manual dispatch is gated the same way: it needs a CI run on the HEAD of
      # the dispatched ref. Poll with gh instead of a workflow_run trigger so
      # the push-triggered release behaviour is unchanged.
      - name: Wait for CI on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository from a
          # .git directory. Pass it explicitly.
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            row=$(gh run list --workflow ci.yml --commit "$SHA" --limit 1 \
              --json databaseId,status,conclusion,url | jq -r '.[0] // empty')
            if [ -n "$row" ]; then
              status=$(jq -r '.status' <<<"$row")
              conclusion=$(jq -r '.conclusion // ""' <<<"$row")
              url=$(jq -r '.url' <<<"$row")
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "CI passed for $SHA: $url"
                  exit 0
                fi
                echo "CI for $SHA concluded '$conclusion': $url" >&2
                exit 1
              fi
              echo "CI run for $SHA is $status; waiting..."
            else
              echo "No CI run for $SHA yet; waiting..."
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for CI on $SHA" >&2
              exit 1
            fi
            sleep 30
          done

  build-core:
    name: Build web, Android and Linux
    needs: [ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build web UI
        run: ./scripts/build_ui.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build Android APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' gui/android/app/build.gradle.kts | head -1)
          rm -f gui/android/app/build/outputs/apk/release/app-release.apk
          (cd gui/android && ./gradlew :app:assembleRelease --no-daemon --stacktrace)
          apk=gui/android/app/build/outputs/apk/release/app-release.apk
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          badging=$("$aapt" dump badging "$apk")
          apk_version=$(grep -m1 -o "versionName='[^']*'" <<<"$badging" | cut -d"'" -f2)
          if [ "$apk_version" != "$version" ]; then
            echo "APK version $apk_version does not match Gradle version $version" >&2
            exit 1
          fi
          signer=$("$apksigner" verify --print-certs "$apk" | tr '[:upper:]' '[:lower:]')
          if ! grep -q 0b0fd0fa35ff712901d42cab215d5e3cb706daef57bffa7ebef61cacda1dc4ce <<<"$signer"; then
            echo "APK has an unexpected signer certificate" >&2
            exit 1
          fi
          mkdir -p builds
          cp "$apk" "builds/mcmusic-${version}.apk"
          echo "built builds/mcmusic-${version}.apk (signed, v$version)"

      - name: Build Linux deb
        run: ./scripts/build_deb.sh

      - name: Publish web assets
        run: ./scripts/publish_apps.sh

      - name: Collect builds folder
        run: ./scripts/collect_builds.sh

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcmusic-core-release
          path: builds/
          if-no-files-found: error

  build-macos:
    name: Build macOS Qt app
    needs: [ci-gate]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native .app and .dmg
        run: |
          set -euo pipefail
          version=$(sed -n 's/^FALLBACK_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/linux/mcmusic_linux/version.py | head -1)
          MAKE_DMG=1 VERSION="$version" ./app/macos/build.sh
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent app/macos/dist/mcmusic.app "artifacts/mcmusic-macos-${version}.app.zip"
          cp app/macos/dist/mcmusic-*.dmg artifacts/
      - name: Verify no web engine or HTML
        run: |
          set -euo pipefail
          app=app/macos/dist/mcmusic.app
          test -f "$app/Contents/MacOS/mcmusic"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Contents/Info.plist" | grep -qx 'dev.mcmusic.app'
          if find "$app" \( -iname 'QtWebEngine*' -o -iname 'QtWebKit*' -o -iname 'index.html' \) | grep -q .; then
            echo "macOS bundle contains a web engine or HTML assets" >&2
            exit 1
          fi
      - name: Verify code signature
        # build.sh re-signs after every Info.plist edit and verifies locally;
        # this independent check stops a stale signature from being published.
        run: codesign --verify --deep --strict --verbose=2 app/macos/dist/mcmusic.app
      - name: Verify and smoke-test the packaged macOS downloads
        # Verify the bytes users actually download, not just the build folder.
        # The zip and DMG can pick up metadata that invalidates a signature,
        # and a valid signature alone does not prove the bundled app launches.
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'hdiutil detach "$tmp/mount" -force >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          zip=$(ls artifacts/mcmusic-macos-*.app.zip)
          ditto -x -k "$zip" "$tmp"
          codesign --verify --deep --strict --verbose=2 "$tmp/mcmusic.app"
          codesign -d --verbose=4 "$tmp/mcmusic.app" 2>&1 | \
            grep -E 'Identifier=|Format=|CodeDirectory|Hash=|Signature=' || true
          # Same headless smoke test as Windows: builds the real Qt window and
          # refreshes its theme, without sign-in, network or audio devices.
          "$tmp/mcmusic.app/Contents/MacOS/mcmusic" --selftest
          dmg=$(ls artifacts/mcmusic-*.dmg)
          mkdir -p "$tmp/mount"
          hdiutil attach "$dmg" -mountpoint "$tmp/mount" -nobrowse -readonly >/dev/null
          codesign --verify --deep --strict --verbose=2 "$tmp/mount/mcmusic.app"
          hdiutil detach "$tmp/mount" -force >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: mcmusic-macos-release
          path: artifacts/
          if-no-files-found: error

  build-windows:
    name: Build Windows Qt app
    needs: [ci-gate]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native .exe and .zip
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $version = (Select-String -Path (Join-Path $root 'app/linux/mcmusic_linux/version.py') -Pattern 'FALLBACK_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          ./app/windows/build.ps1 -Version $version -Zip
          # build.ps1 leaves PowerShell in app/windows; restore the workspace root.
          Set-Location $root
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item (Join-Path $root 'app/windows/dist/mcmusic-windows-x64.zip') (Join-Path $root "artifacts/mcmusic-windows-$version.zip")
      - name: Verify no web engine or HTML
        shell: pwsh
        run: |
          $exe = "app/windows/dist/mcmusic/mcmusic.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $web = Get-ChildItem -Path "app/windows/dist/mcmusic" -Recurse -File |
            Where-Object { $_.Name -match 'QtWebEngine|QtWebKit|index\.html' }
          if ($web) { throw "Windows build contains a web engine or HTML: $($web.FullName -join ', ')" }
      - uses: actions/upload-artifact@v4
        with:
          name: mcmusic-windows-release
          path: artifacts/
          if-no-files-found: error

  build-ios:
    name: Build iOS SwiftUI app
    needs: [ci-gate]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare app icon
        run: |
          set -euo pipefail
          mkdir -p app/ios/McMusic/Assets.xcassets/AppIcon.appiconset
          sips -z 1024 1024 web/icon-512.png --out app/ios/McMusic/Assets.xcassets/AppIcon.appiconset/icon-1024.png >/dev/null
      - name: Generate Xcode project
        run: xcodegen generate --spec app/ios/project.yml --project app/ios
      - name: Build and test unsigned iOS Simulator app
        run: |
          set -euo pipefail
          derived=build/ios
          common=(-project app/ios/McMusic.xcodeproj -configuration Release CODE_SIGNING_ALLOWED=NO)
          xcodebuild "${common[@]}" -scheme McMusicApp -derivedDataPath "$derived" \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO build
          sim_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); devs=[x for r in d["devices"].values() for x in r if x.get("isAvailable") and x["name"].startswith("iPhone")]; print(devs[0]["udid"] if devs else "")')
          if [ -n "$sim_id" ]; then
            xcodebuild "${common[@]}" -scheme McMusic -derivedDataPath build/ios-tests \
              -sdk iphonesimulator -destination "platform=iOS Simulator,id=$sim_id" \
              test
          else
            echo "no iPhone simulator available; skipping test action" >&2
          fi
      - name: Package simulator build
        run: |
          set -euo pipefail
          version=$(sed -n 's/^FALLBACK_VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/linux/mcmusic_linux/version.py | head -1)
          app=build/ios/Build/Products/Release-iphonesimulator/McMusic.app
          test -f "$app/McMusic"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist" | grep -qx 'dev.mcmusic.ios'
          if find "$app" \( -iname '*WebView*' -o -iname 'index.html' -o -iname '*XCTest*' \) | grep -q .; then
            echo "iOS bundle contains a web view, HTML or test frameworks" >&2
            exit 1
          fi
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" "artifacts/mcmusic-ios-simulator-${version}.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mcmusic-ios-release
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Publish latest and version releases
    runs-on: ubuntu-latest
    needs: [build-core, build-macos, build-windows, build-ios]
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble builds folder
        run: |
          set -euo pipefail
          mkdir -p builds
          cp -R artifacts/mcmusic-core-release/. builds/
          for f in artifacts/mcmusic-macos-release/* artifacts/mcmusic-windows-release/* artifacts/mcmusic-ios-release/*; do
            [ -f "$f" ] || continue
            cp "$f" builds/
          done
          ./scripts/collect_builds.sh
          ls -lh builds

      - name: Publish latest and version releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh

      - name: Verify GitHub Latest is the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" -q .tag_name)
          if [[ $tag != latest ]]; then
            echo "GitHub Latest is '$tag', expected 'latest'; the build fallback would read the wrong release" >&2
            exit 1
          fi
          echo "GitHub Latest verified: latest"

      - name: Refresh the tracked release manifest
        # builds/ itself is ignored; these text files record the published
        # asset names, sizes and digests without committing any binary.
        run: python3 scripts/write_release_manifest.py

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo
            echo "- Commit: \`$(git rev-parse --short=12 HEAD)\`"
            echo
            echo "### Artifacts"
            if ls builds/* >/dev/null 2>&1; then
              echo '| File | Size |'
              echo '| --- | ---: |'
              for f in builds/*; do
                [ -f "$f" ] || continue
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
            else
              echo "_No build artifacts found._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the release manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the small text records are tracked; binaries stay on GitHub.
          # GITHUB_TOKEN pushes do not retrigger workflows, so no CI skip marker.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed FETCH_HEAD
            git add -- builds/README.md builds/SHA256SUMS builds/release-manifest.json
            if git diff --cached --quiet; then
              echo "release manifest is already current"
              exit 0
            fi
            git commit -m "Update release manifest (no binaries)"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with another commit; retrying (attempt $attempt)" >&2
            sleep 5
          done
          echo "could not update the release manifest after 3 attempts" >&2
          exit 1
