name: Release builds

# Every push to main produces the same artifacts the server hands out and
# refreshes the rolling "latest" GitHub Release plus the repo-root builds/
# snapshot. Pushes made by this workflow use GITHUB_TOKEN, which does not
# trigger another run, so there is no build loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build web UI
        run: ./scripts/build_ui.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Build Android APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' gui/android/app/build.gradle.kts | head -1)
          rm -f gui/android/app/build/outputs/apk/release/app-release.apk
          (cd gui/android && ./gradlew :app:assembleRelease --no-daemon --stacktrace)
          apk=gui/android/app/build/outputs/apk/release/app-release.apk
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          badging=$("$aapt" dump badging "$apk")
          apk_version=$(grep -m1 -o "versionName='[^']*'" <<<"$badging" | cut -d"'" -f2)
          if [ "$apk_version" != "$version" ]; then
            echo "APK version $apk_version does not match Gradle version $version" >&2
            exit 1
          fi
          signer=$("$apksigner" verify --print-certs "$apk" | tr '[:upper:]' '[:lower:]')
          if ! grep -q 0b0fd0fa35ff712901d42cab215d5e3cb706daef57bffa7ebef61cacda1dc4ce <<<"$signer"; then
            echo "APK has an unexpected signer certificate" >&2
            exit 1
          fi
          mkdir -p builds
          cp "$apk" "builds/mcmusic-${version}.apk"
          echo "built builds/mcmusic-${version}.apk (signed, v$version)"

      - name: Build Linux deb
        run: ./scripts/build_deb.sh

      - name: Publish web assets
        run: ./scripts/publish_apps.sh

      - name: Collect builds folder
        run: ./scripts/collect_builds.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcmusic-builds-${{ github.sha }}
          path: builds/
          if-no-files-found: error

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          desktop=$(grep -oP '^version\s*=\s*"\K[^"]+' app/linux/pyproject.toml | head -1 || echo "")
          sha=$(git rev-parse --short=12 HEAD)
          android_version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' gui/android/app/build.gradle.kts | head -1)
          current_apk="mcmusic-${android_version}.apk"
          artifacts=()
          notes=$(mktemp)
          {
            echo "## mcmusic latest"
            echo
            echo "Built automatically from \`${sha}\` on \`main\`."
            echo
            echo "### Builds"
            echo "| Artifact | Size | SHA256 |"
            echo "| --- | ---: | --- |"
            for f in builds/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              # Older APK snapshots stay in the repo for rollback, but the
              # release must only advertise the APK built by this run.
              case "$base" in
                mcmusic-*.apk) [ "$base" = "$current_apk" ] || continue ;;
              esac
              artifacts+=("$f")
              [ "$base" = "SHA256SUMS" ] && continue
              size=$(du -h "$f" | cut -f1)
              sum=$(sha256sum "$f" | cut -d' ' -f1)
              echo "| \`$base\` | $size | \`${sum:0:16}…\` |"
            done
            echo
            echo "### Notes"
            [ -n "$desktop" ] && echo "- Desktop package version: \`${desktop}\`."
            echo "- Android: \`${current_apk}\` (v${android_version})."
            echo "- Linux deb: \`sudo apt install ./file.deb\`. AppImage: \`chmod +x\` then run."
            echo "- Full checksums: \`SHA256SUMS\`."
            echo
            echo "### Recent changes"
            git log -n 8 --pretty=format:'- %s (`%h`)' || true
            echo
          } > "$notes"

          if gh release view latest >/dev/null 2>&1; then
            # Remove stale APKs and assets that are no longer in builds/, or the
            # release keeps advertising builds this run did not produce.
            for asset in $(gh release view latest --json assets -q '.assets[].name'); do
              case "$asset" in
                README.md|SHA256SUMS) continue ;;
              esac
              if [[ "$asset" == mcmusic-*.apk && "$asset" != "$current_apk" ]]; then
                gh release delete-asset latest "$asset" -y >/dev/null 2>&1 || true
                continue
              fi
              if [ ! -f "builds/$asset" ]; then
                gh release delete-asset latest "$asset" -y >/dev/null 2>&1 || true
              fi
            done
            # --latest keeps the rolling release on top; without it GitHub marks
            # whichever hand-cut version was published most recently as Latest.
            gh release edit latest --title "mcmusic latest builds" --notes-file "$notes" --latest
          else
            gh release create latest --title "mcmusic latest builds" \
              --notes-file "$notes" --latest
          fi
          gh release upload latest "${artifacts[@]}" --clobber

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo
            echo "- Commit: \`$(git rev-parse --short=12 HEAD)\`"
            echo
            echo "### Artifacts"
            if ls builds/* >/dev/null 2>&1; then
              echo '| File | Size |'
              echo '| --- | ---: |'
              for f in builds/*; do
                [ -f "$f" ] || continue
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
            else
              echo "_No build artifacts found._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh builds folder in the repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # builds/ holds freshly rebuilt binaries, so rebasing a racing push
          # conflicts on them. Re-apply this run's files on top of origin/main
          # instead, and retry if someone pushes in between.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed FETCH_HEAD
            git add -A builds
            if git diff --cached --quiet; then
              echo "builds/ is already current"
              exit 0
            fi
            git commit -m "Update published builds [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with another commit; retrying (attempt $attempt)" >&2
            sleep 5
          done
          echo "could not update builds/ after 3 attempts" >&2
          exit 1
