name: Release builds

# Every push to main produces the same artifacts the server hands out and
# refreshes the rolling "latest" GitHub Release plus the repo-root builds/
# snapshot. Pushes made by this workflow use GITHUB_TOKEN, which does not
# trigger another run, so there is no build loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secrets are not allowed inside a step's `if:`, so expose the optional
    # signing key as an environment variable first.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships the Android command-line tools and sets
      # ANDROID_HOME. The old setup-android action tried to install the
      # removed legacy "tools" package, so install only what this build uses.
      - name: Install Android SDK platform and build tools
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=$(find "$sdk/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort | tail -1)
          fi
          echo "using $sdkmanager"
          "$sdkmanager" --version
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      # A CI-generated debug keystore has a different signature, so its APK
      # cannot install over the one already on people's phones. When the
      # original ~/.android/debug.keystore is supplied as a secret, CI signs
      # with it and ships a real update. Without it, the APK committed in
      # builds/ is released unchanged and CI still compiles the source.
      - name: Restore the Android debug key (optional)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build Android APK
        run: gradle -p app/android assembleDebug --no-daemon --console=plain

      - name: Build Linux deb
        run: ./scripts/build_deb.sh

      - name: Publish web assets
        env:
          MCMUSIC_KEEP_APK: ${{ env.ANDROID_KEYSTORE_BASE64 == '' && '1' || '0' }}
        run: ./scripts/publish_apps.sh

      - name: Collect builds folder
        env:
          MCMUSIC_KEEP_APK: ${{ env.ANDROID_KEYSTORE_BASE64 == '' && '1' || '0' }}
        run: ./scripts/collect_builds.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcmusic-builds-${{ github.sha }}
          path: builds/
          if-no-files-found: error

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          android=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/android/app/build.gradle.kts | head -1)
          android=${android:-dev}
          desktop=$(grep -oP '^version\s*=\s*"\K[^"]+' app/linux/pyproject.toml | head -1 || echo "")
          sha=$(git rev-parse --short=12 HEAD)
          notes=$(mktemp)
          {
            echo "## mcmusic latest"
            echo
            echo "Built automatically from \`${sha}\` on \`main\`."
            echo
            echo "### Builds"
            echo "| Artifact | Size | SHA256 |"
            echo "| --- | ---: | --- |"
            for f in builds/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              [ "$base" = "SHA256SUMS" ] && continue
              size=$(du -h "$f" | cut -f1)
              sum=$(sha256sum "$f" | cut -d' ' -f1)
              echo "| \`$base\` | $size | \`${sum:0:16}…\` |"
            done
            echo
            echo "### Notes"
            echo "- Android version: \`${android}\` (installs over the current copy when signatures match)."
            [ -n "$desktop" ] && echo "- Desktop package version: \`${desktop}\`."
            echo "- Linux deb: \`sudo apt install ./file.deb\`. AppImage: \`chmod +x\` then run."
            echo "- Full checksums: \`SHA256SUMS\`."
            echo
            echo "### Recent changes"
            git log -n 8 --pretty=format:'- %s (`%h`)' || true
            echo
          } > "$notes"

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "mcmusic latest builds" --notes-file "$notes"
          else
            gh release create latest --title "mcmusic latest builds" \
              --notes-file "$notes" --latest
          fi
          gh release upload latest builds/* --clobber

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo
            echo "- Commit: \`$(git rev-parse --short=12 HEAD)\`"
            echo "- Android version: \`$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/android/app/build.gradle.kts | head -1 || echo dev)\`"
            echo
            echo "### Artifacts"
            if ls builds/* >/dev/null 2>&1; then
              echo '| File | Size |'
              echo '| --- | ---: |'
              for f in builds/*; do
                [ -f "$f" ] || continue
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
            else
              echo "_No build artifacts found._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh builds folder in the repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds
          if git diff --cached --quiet; then
            echo "builds/ is already current"
            exit 0
          fi
          git commit -m "Update published builds [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
