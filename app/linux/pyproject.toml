[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmusic-desktop"
version = "2.2.0"
description = "Native Linux desktop client for the mcmusic server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
]

[project.scripts]
mcmusic-desktop = "mcmusic_linux.cli:main"

[tool.setuptools.packages.find]
include = ["mcmusic_linux*"]

[tool.setuptools.package-data]
mcmusic_linux = ["assets/*"]
