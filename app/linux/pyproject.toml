[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmusic-desktop"
dynamic = ["version"]
description = "Native Linux desktop client for the mcmusic server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "requests>=2.31",
]

[project.optional-dependencies]
macos-media = ["pyobjc-framework-MediaPlayer>=9.0; sys_platform == 'darwin'"]
windows-media = ["winsdk>=1.0; sys_platform == 'win32'"]

[project.scripts]
mcmusic-desktop = "mcmusic_linux.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mcmusic_linux.version.FALLBACK_VERSION" }

[tool.setuptools.packages.find]
include = ["mcmusic_linux*"]

[tool.setuptools.package-data]
mcmusic_linux = ["assets/*"]
